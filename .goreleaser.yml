# S3ry GoReleaser Configuration

version: 2

# Project metadata
project_name: s3ry

# Environment variables
env:
  - GO111MODULE=on
  - CGO_ENABLED=0

# Git configuration
git:
  tag_sort: -version:refname

# Build configuration
builds:
  - id: s3ry
    main: ./cmd/s3ry
    binary: s3ry
    
    # Build flags
    flags:
      - -trimpath
    
    # Linker flags for optimization
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    
    # Environment variables
    env:
      - CGO_ENABLED=0
    
    # Target platforms
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    
    goarch:
      - amd64
      - arm64
      - arm
    
    goarm:
      - "6"
      - "7"
    
    # Ignore combinations
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm

# Universal binaries for macOS
universal_binaries:
  - id: s3ry-universal
    ids:
      - s3ry
    name_template: s3ry
    replace: true

# Archives configuration
archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    
    # Archive contents
    files:
      - README.md
      - LICENSE
    
    # Format overrides
    format_overrides:
      - goos: windows
        format: zip

# Checksums
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'
      - '^style:'
      - '^refactor:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Other improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

# GitHub release
release:
  github:
    owner: seike460
    name: s3ry
  
  # Release notes
  header: |
    Release notes: see CHANGELOG.md
  
  footer: |
    Release notes: see CHANGELOG.md
  
  # Release settings
  draft: false
  prerelease: auto
  mode: replace
  
# Homebrew tap
brews:
  - name: s3ry
    repository:
      owner: seike460
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    
    # Metadata
    description: "Interactive terminal client for Amazon S3"
    homepage: "https://github.com/seike460/s3ry"
    license: "MIT"
    
    # Dependencies
    dependencies:
      - name: go
        type: optional
    
    # Installation
    install: |
      bin.install "s3ry"
    
    # Test
    test: |
      system "#{bin}/s3ry", "version"

# Linux packages
nfpms:
  - id: packages
    package_name: s3ry
    # Debian names both ARMv6 and ARMv7 packages "armhf"; disambiguate the
    # armv6 deb so the two do not collide. (GoReleaser docs workaround.)
    file_name_template: >-
      {{- trimsuffix .ConventionalFileName .ConventionalExtension -}}
      {{- if and (eq .Arm "6") (eq .ConventionalExtension ".deb") }}6{{ end -}}
      {{- if not (eq .Amd64 "v1")}}{{ .Amd64 }}{{ end -}}
      {{- .ConventionalExtension -}}
    
    # Metadata
    vendor: seike460
    homepage: "https://github.com/seike460/s3ry"
    maintainer: "seike460 <seike460@gmail.com>"
    description: "Interactive terminal client for Amazon S3"
    license: "MIT"
    
    # Package formats
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    
    # Dependencies
    dependencies:
      - ca-certificates
    
    # Files
    contents:
      - src: ./README.md
        dst: /usr/share/doc/s3ry/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/s3ry/LICENSE

# Publishers (disabled for this release)
# publishers:
#   - name: fury.io
#     ids:
#       - packages
#     dir: "{{ dir .ArtifactPath }}"
#     cmd: |
#       curl -F package=@{{ .ArtifactName }} https://{{ .Env.FURY_TOKEN }}@push.fury.io/seike460/

# Announce
announce:
  # Skip announce on pre-releases. .Prerelease resolves to the string
  # "true"/"false", so compare with `eq` rather than `gt`.
  skip: "{{ eq .Prerelease \"true\" }}"
