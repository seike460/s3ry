[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
gofumpt = "0.7.0"
goreleaser = "2.5.0"

[env]
CGO_ENABLED = "0"
GOFLAGS = "-mod=readonly"

[tasks.build]
description = "Build the s3ry binary"
run = "make build"

[tasks.test]
description = "Run tests"
run = "make test"

[tasks.lint]
description = "Run linting"
run = "make lint"

[tasks.bench]
description = "Run benchmarks"
run = "make bench"
